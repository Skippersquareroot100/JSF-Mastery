<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" 
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<!-- 
    JSF NAMESPACES EXPLAINED:
    xmlns:h  => Standard HTML components (provided by JSF)
    xmlns:f  => Core JSF components (converters, validators, listeners)
    xmlns:p  => PrimeFaces components (Rich UI library)
-->
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <h:head>
        <title>JSF Lifecycle - Mastery</title>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    </h:head>

    <h:body style="font-family: Arial, sans-serif; margin: 20px;">

        <h1 style="text-align:center; color:#2196F3;">JSF Lifecycle Demo</h1>

        <!-- 
            h:form is required for any interactive components.
            It generates a standard HTML <form> and handles the JSF postback.
        -->
        <h:form id="mainForm">

            <p:panel header="Try it out!" style="max-width: 600px; margin: 0 auto;">
                <h:panelGrid columns="2" cellpadding="10" style="margin: 20px auto;">

                    <h:outputLabel value="Enter your name: " for="name" />

                    <!-- 
                        p:inputText is a PrimeFaces input field.
                        value="#{formBean.name}" connects this field to the 'name' property in FormBean.java.
                        required="true" tells JSF to validate this field during Phase 3.
                    -->
                    <p:inputText id="name"
                                 value="#{formBean.name}"
                                 required="true"
                                 requiredMessage="Oops! Please enter your name."
                                 label="Name" />

                    <h:outputText value="" />
                    <!-- p:message displays validation errors specifically for the 'name' field -->
                    <p:message for="name" />

                    <h:outputText value="" />
                    <!-- 
                        p:commandButton is an AJAX-enabled button.
                        action="#{formBean.submit}" calls the submit() method in Phase 5.
                        update="@form" tells PrimeFaces to refresh the form via AJAX after execution.
                    -->
                    <p:commandButton value="Submit &amp; See Lifecycle"                                
                                     action="#{formBean.submit}"
                                     update="@form" 
                                     icon="pi pi-check" />

                </h:panelGrid>

                <!-- 
                    This section is hidden (rendered="false") until formBean.name has a value.
                    #{not empty formBean.name} is EL (Expression Language) logic.
                -->
                <h:panelGroup rendered="#{not empty formBean.name}" 
                              layout="block" 
                              style="text-align:center; margin-top:20px; font-size:1.2em; color:#4CAF50;">
                    Hello, <strong>#{formBean.name}</strong>! 
                    <br/>
                    <small style="color: #666;">Check your terminal/console logs to see the 6 JSF phases in action.</small>
                </h:panelGroup>
            </p:panel>

        </h:form>

    </h:body>
</html>
